<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IELTS NovaPrep — Practice Smarter. Improve Faster. Achieve Your IELTS Goal.</title>
    <meta name="description" content="IELTS NovaPrep is a premium international EdTech platform for IELTS preparation. Practice authentic Listening, Reading, Writing, Speaking, Vocabulary, Grammar, and Mock Tests with instant feedback." />
    <meta name="keywords" content="IELTS preparation, IELTS practice, IELTS listening, IELTS reading, IELTS writing task 2, IELTS speaking mock, IELTS vocabulary, band score predictor" />
    <meta property="og:title" content="IELTS NovaPrep — Practice Smarter. Improve Faster." />
    <meta property="og:description" content="Master IELTS with real-time audio players, microphone speaking studio with fluency analysis, writing evaluation, interactive grammar lab, and smart mistake book." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/logo.jpg" />
    <meta name="theme-color" content="#0055D4" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400..900&display=swap" rel="stylesheet">
    <script>
      // Automatically redirect to local server if opened via direct file:// protocol
      if (window.location.protocol === 'file:') {
        window.location.replace('http://localhost:5173/');
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="file-protocol-notice" style="display: none; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; align-items: center; justify-content: center; background: #f8fafc; padding: 2rem;">
        <div style="max-width: 500px; width: 100%; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 2.5rem; text-align: center; box-shadow: 0 10px 30px rgba(0, 85, 212, 0.08);">
          <div style="width: 72px; height: 72px; margin: 0 auto 1.25rem auto; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 14px rgba(0, 85, 212, 0.15);">
            <img src="./public/assets/emblem.png" alt="IELTS NovaPrep" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <h2 style="font-size: 1.5rem; font-weight: 800; color: #0a1628; margin-bottom: 0.5rem;">IELTS NovaPrep</h2>
          <p style="font-size: 0.95rem; color: #475569; line-height: 1.5; margin-bottom: 1.75rem;">
            Redirecting to your active practice platform...
          </p>
          <a href="http://localhost:5173/" style="display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 0.85rem 1.5rem; font-size: 1rem; font-weight: 700; color: #ffffff; background: #0055d4; border-radius: 12px; text-decoration: none; box-shadow: 0 4px 12px rgba(0, 85, 212, 0.25);">
            Click to Open IELTS NovaPrep &rarr;
          </a>
          <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 1.25rem;">
            Or run <strong>Start-Website.bat</strong> in your project folder.
          </p>
        </div>
      </div>
      <script>
        if (window.location.protocol === 'file:') {
          var notice = document.getElementById('file-protocol-notice');
          if (notice) notice.style.display = 'flex';
          setTimeout(function() {
            window.location.href = 'http://localhost:5173/';
          }, 100);
        }
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
